services:
  backend:
    build: ./backend
    network_mode: "host"
    devices:
      - "/dev/can0:/dev/can0"
    privileged: true
    ports:
      - '3001:3001'
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
  frontend:
    build: ./frontend
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      - backend
